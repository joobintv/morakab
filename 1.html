<style>
body {font-family:'Vazirmatn', Tahoma, sans-serif; background:#fff; color:#2c3e50; text-align:center; padding:20px; margin:0; transition:0.3s;}
body.dark {background:#121212; color:#e0e0e0;}
h2 {margin-bottom:25px; font-size:28px;}
.input-group {display:flex; flex-direction:column; align-items:flex-end; margin-bottom:25px; width:100%; max-width:350px; margin-left:auto; margin-right:auto;}
.input-group label {margin-bottom:5px; font-weight:bold; align-self:flex-end;}
.input-group input {padding:12px; font-size:16px; width:100%; border-radius:8px; border:1px solid #ccc; outline:none; transition:0.3s;}
body.dark .input-group input {background:#1e1e1e; color:#e0e0e0; border:1px solid #444;}
.error-msg {color:red; font-size:14px; margin-top:-20px; margin-bottom:10px; display:none; text-align:center;}
button {padding:12px 25px; font-size:16px; border-radius:12px; border:none; cursor:pointer; margin:10px 5px; transition:0.3s; font-family:'Vazirmatn',Tahoma,sans-serif; font-weight:bold; box-shadow:0 4px 8px rgba(0,0,0,0.2);}
button.calc {background:linear-gradient(45deg,#3498db,#2980b9); color:#fff;}
button.calc:hover {background:linear-gradient(45deg,#2980b9,#1c5980);}
button.reset {background:linear-gradient(45deg,#e74c3c,#c0392b); color:#fff;}
button.reset:hover {background:linear-gradient(45deg,#c0392b,#8e2b24);}
button.admin {background:linear-gradient(45deg,#f39c12,#d35400); color:#fff; padding:14px 30px; font-size:18px;}
button.admin:hover {background:linear-gradient(45deg,#d35400,#a84300);}
#result {margin:20px 0; font-weight:bold; font-size:18px; background-color:#f2f2f2; padding:15px 25px; border-radius:12px; display:inline-block; transition:0.3s;}
body.dark #result {background:#1e1e1e; color:#e0e0e0;}
table {width:100%; max-width:700px; margin:20px auto; border-collapse:collapse; background:#f9f9f9; border-radius:10px; overflow:hidden; font-size:14px; transition:0.3s;}
body.dark table {background:#1e1e1e; color:#e0e0e0;}
th,td {padding:12px; text-align:center; border-bottom:1px solid #ddd;}
th {background-color:#3498db; color:#fff;}
tr:nth-child(even){background-color:#f2f2f2;}
tr:nth-child(odd){background-color:#fff;}
body.dark tr:nth-child(even){background-color:#2a2a2a;}
body.dark tr:nth-child(odd){background-color:#1e1e1e;}
#darkModeBtn {position:fixed; top:0px; left:300px; z-index:1000; font-size:24px;}
@media(max-width:480px){.input-group input{width:90%;} table,th,td{font-size:12px;} #result{font-size:16px; padding:10px 15px;}}
</style>
</head>
<body>

<button id="darkModeBtn">🌙</button>
<h2>ماشین حساب سود مرکب</h2>

<div class="input-group"><label>سرمایه اولیه:</label><input type="number" id="initial" placeholder="مثلاً 1"></div>
<div class="input-group"><label>سود هر گام (٪):</label><input type="number" id="rate" placeholder="مثلاً 10"></div>
<div class="input-group"><label>تعداد گام:</label><input type="number" id="steps" placeholder="مثلاً 5"></div>
<div class="error-msg" id="errorMsg">لطفا مقادیر معتبر وارد کنید.</div>

<button class="calc">محاسبه</button>
<button class="reset">پاک‌سازی</button>

<div id="result"></div>
<div id="tableContainer"></div>
<canvas id="chart" style="max-width:700px;margin:20px auto;display:block;"></canvas>


<script>
document.addEventListener('DOMContentLoaded', function(){

  let chart;
  const errorMsg=document.getElementById('errorMsg');
  const initialInput=document.getElementById('initial');
  const rateInput=document.getElementById('rate');
  const stepsInput=document.getElementById('steps');
  const resultDiv=document.getElementById('result');
  const tableContainer=document.getElementById('tableContainer');
  const chartCtx=document.getElementById('chart').getContext('2d');

  document.querySelector('.calc').addEventListener('click', calculate);
  document.querySelector('.reset').addEventListener('click', resetForm);
  document.getElementById('darkModeBtn').addEventListener('click', toggleDarkMode);
  document.querySelector('.admin').addEventListener('click', contactAdmin);

  function calculate(){
    errorMsg.style.display='none';
    let initial=parseFloat(initialInput.value);
    let rate=parseFloat(rateInput.value)/100;
    let steps=parseInt(stepsInput.value);
    if(isNaN(initial)||isNaN(rate)||isNaN(steps)||initial<=0||rate<0||steps<=0){ errorMsg.style.display='block'; return; }

    let capital=initial, totalProfit=0;
    let tableHTML="<table><tr><th>گام</th><th>سرمایه قبل</th><th>سود گام</th><th>سرمایه بعد</th></tr>";
    let labels=[], data=[];
    for(let i=1;i<=steps;i++){
      let profit=capital*rate;
      totalProfit+=profit;
      let newCapital=capital+profit;
      tableHTML+=`<tr><td>${i}</td><td>${capital.toLocaleString()}</td><td>${profit.toLocaleString()}</td><td>${newCapital.toLocaleString()}</td></tr>`;
      capital=newCapital;
      labels.push(`گام ${i}`);
      data.push(capital.toFixed(2));
    }
    tableHTML+="</table>";
    tableContainer.innerHTML=tableHTML;
    resultDiv.innerText=`💰 سود نهایی: ${totalProfit.toLocaleString()} | سرمایه نهایی: ${capital.toLocaleString()}`;
    // <-- خط اصلاح‌شده: دیگر پیام خطا بعد از محاسبه نشان داده نخواهد شد
    errorMsg.style.display='none';

    if(chart) chart.destroy();
    chart=new Chart(chartCtx,{
      type:'line',
      data:{labels:labels, datasets:[{label:'روند رشد سرمایه', data:data, borderColor:document.body.classList.contains('dark')?'#4dc3ff':'#3498db', backgroundColor:document.body.classList.contains('dark')?'rgba(77,195,255,0.3)':'rgba(52,152,219,0.3)', tension:0.3, fill:true, pointRadius:5, pointBackgroundColor:document.body.classList.contains('dark')?'#4dc3ff':'#3498db'}]},
      options:{responsive:true, plugins:{legend:{display:true, labels:{color:document.body.classList.contains('dark')?'#e0e0e0':'#2c3e50', font:{size:14}}}}, scales:{x:{ticks:{color:document.body.classList.contains('dark')?'#e0e0e0':'#2c3e50'}}, y:{ticks:{color:document.body.classList.contains('dark')?'#e0e0e0':'#2c3e50'}}}}
    });
  }

  function resetForm(){
    initialInput.value=''; rateInput.value=''; stepsInput.value='';
    resultDiv.innerText=''; tableContainer.innerHTML=''; errorMsg.style.display='none';
    if(chart) chart.destroy();
  }

  function toggleDarkMode(){
    document.body.classList.toggle('dark');
    if(tableContainer.innerHTML!=='') calculate();
  }

  function contactAdmin(){
    window.location.href='mailto:admin@example.com';
  }

});
</script>


</body>
</html>
